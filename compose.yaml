name: bookshelf
services:
  database:
    image: mysql:8.4
    container_name: bookshelf-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookshelf
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - bookshelf_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bookshelf-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
    depends_on:
      database:
        condition: service_healthy

volumes:
  bookshelf_data: